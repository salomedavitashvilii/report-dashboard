<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="utf-8" />
    <title>შესვლა - {{ app_title if app_title else 'REPORT Dashboard' }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --primary: #3b82f6;
        --primary-dark: #2563eb;
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-light: #334155;
        --text: #e2e8f0;
        --text-dim: #94a3b8;
        --border: #475569;
        --error: #ef4444;
        --success: #22c55e;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      /* Background animation */
      body::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        top: -50%;
        left: -50%;
        background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
        opacity: 0.1;
        animation: rotate 30s linear infinite;
      }

      @keyframes rotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .login-container {
        width: 100%;
        max-width: 420px;
        padding: 20px;
        position: relative;
        z-index: 1;
      }

      .login-card {
        background: var(--surface);
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        border: 1px solid var(--border);
      }

      .logo-section {
        text-align: center;
        margin-bottom: 32px;
      }

      .logo {
        width: 60px;
        height: 60px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 24px;
        font-weight: bold;
        color: white;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      .title {
        font-size: 28px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 8px;
      }

      .subtitle {
        color: var(--text-dim);
        font-size: 14px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-dim);
        font-size: 14px;
        font-weight: 500;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px 16px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 15px;
        transition: all 0.3s;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-right: 8px;
        cursor: pointer;
        accent-color: var(--primary);
      }

      .checkbox-label {
        color: var(--text-dim);
        font-size: 14px;
        cursor: pointer;
        user-select: none;
      }

      .btn-login {
        width: 100%;
        padding: 14px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      .btn-login:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
      }

      .btn-login:active {
        transform: translateY(0);
      }

      .error-message {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: var(--error);
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 20px;
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .error-icon {
        font-size: 18px;
      }

      .footer-text {
        text-align: center;
        margin-top: 24px;
        color: var(--text-dim);
        font-size: 12px;
      }

      /* Loading state */
      .btn-login:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Icons */
      .input-group {
        position: relative;
      }

      .input-icon {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
        font-size: 18px;
      }

      /* Password toggle */
      .password-toggle {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: var(--text-dim);
        cursor: pointer;
        padding: 4px;
        font-size: 18px;
      }

      .password-toggle:hover {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div class="logo-section">
          <div class="logo">RD</div>
          <h1 class="title">REPORT Dashboard</h1>
          <p class="subtitle">სისტემაში შესასვლელად შეიყვანეთ მონაცემები</p>
        </div>

        {% if error %}
        <div class="error-message">
          <span class="error-icon">⚠</span>
          {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login" id="loginForm">
          <div class="form-group">
            <label for="username">მომხმარებელი</label>
            <div class="input-group">
              <input
                type="text"
                id="username"
                name="username"
                required
                placeholder="შეიყვანეთ მომხმარებელი"
                autocomplete="username"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">პაროლი</label>
            <div class="input-group">
              <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="შეიყვანეთ პაროლი"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePassword()"
              >
                👁
              </button>
            </div>
          </div>

          <div class="checkbox-group">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember" class="checkbox-label"
              >დამახსოვრება (7 დღე)</label
            >
          </div>

          <button type="submit" class="btn-login" id="submitBtn">შესვლა</button>
        </form>

        <div class="footer-text">© 2025 LUKA NUKRADZE</div>
      </div>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleBtn = document.querySelector(".password-toggle");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleBtn.textContent = "👁‍🗨";
        } else {
          passwordInput.type = "password";
          toggleBtn.textContent = "👁";
        }
      }

      // Form submission handling
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          const btn = document.getElementById("submitBtn");
          btn.disabled = true;
          btn.innerHTML = '<span class="spinner"></span> შესვლა...';
        });

      // Auto-focus on username field
      window.addEventListener("load", function () {
        document.getElementById("username").focus();
      });

      // Enter key handling
      document
        .getElementById("password")
        .addEventListener("keypress", function (e) {
          if (e.key === "Enter") {
            document.getElementById("loginForm").submit();
          }
        });
    </script>
  </body>
</html>
